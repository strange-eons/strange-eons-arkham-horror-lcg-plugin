name: Bundles

on:
  push:
    branches: [main]
    # release versions (10.0, 10.0.1); -SNAPSHOT versions are never tagged
    tags: ['[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Build bundles
        run: ./gradlew bundles

      # tags get a versioned release; main gets a rolling prerelease
      # that is replaced on each commit; other refs only build
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            title="$REF_NAME"
            flags=()
          else
            tag=latest-main
            title="Latest build (main)"
            flags=(--prerelease)
            gh release delete "$tag" --cleanup-tag --yes || true
          fi
          gh release create "$tag" build/dist/*.seext \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Built from ${GITHUB_SHA::7}." \
            "${flags[@]}"
